 return `<svg viewBox="0 0 200 360">${shape}${txt}</svg>`}
const srcs=d=>[`img/${d.id}.png`,...(d.img||[])];
function setSrc(el,i){const d=DRINKS[el.dataset.id],s=srcs(d);if(i>=s.length){const w=document.createElement("div");w.innerHTML=placeholder(d);el.replaceWith(w.firstChild);return}
 el.dataset.n=i;el.classList.toggle("rm",/^https?:/.test(s[i]));el.src=s[i]}
window.imgFail=el=>setSrc(el,+el.dataset.n+1);
const art=d=>{const w=document.createElement("div");w.innerHTML=`<img referrerpolicy="no-referrer" data-id="${d.id}" data-n="0" alt="${d.name}" onerror="imgFail(this)">`;const el=w.firstChild;setSrc(el,0);return el};
const CATS=[...new Set(DRINKS.map(d=>d.cat))],cart={};
$("mq").innerHTML=Array(6).fill(CATS.join(" ✺ ")+" ✺ ").join("");
$("menu").innerHTML=CATS.map(c=>{const items=DRINKS.filter(d=>d.cat===c);
 return `<section><h2>${c}<sup>${String(items.length).padStart(2,"0")}</sup></h2>`+items.map(d=>`
 <div class="row" id="r${d.id}" data-id="${d.id}"><span class="n">${String(d.id+1).padStart(2,"0")}</span>
 <div class="t">${d.name}${d.isNew?'<span class="tag">NEW</span>':''}${d.sale?'<span class="tag">SALE</span>':''}<small>${d.sale||''}</small></div>
 <span class="p">${d.price} kr</span>
 <div class="q"><button data-d="-1" aria-label="less">−</button><span id="q${d.id}">0</span><button data-d="1" aria-label="more">+</button></div></div>`).join("")+`</section>`}).join("");
$("menu").addEventListener("click",e=>{const r=e.target.closest(".row");if(!r)return;const id=+r.dataset.id,b=e.target.closest("button");if(b)chg(id,+b.dataset.d);show(id)});
function chg(id,d){cart[id]=Math.max(0,Math.min(20,(cart[id]||0)+d));$("q"+id).textContent=cart[id];upd()}
const lines=()=>Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>[DRINKS[id],q]);
const total=()=>lines().reduce((s,[d,q])=>s+d.price*q,0);
const desc=()=>lines().map(([d,q])=>`${q}× ${d.name}`).join(", ");
function upd(){$("tot").textContent=total()+" kr";$("sum").textContent=desc();$("dock").classList.toggle("on",total()>0)}
function show(id){document.querySelectorAll(".row.sel").forEach(r=>r.classList.remove("sel"));$("r"+id).classList.add("sel");
 const d=DRINKS[id];$("ic").textContent=d.cat;$("in").textContent=d.name;$("ip").textContent=d.price+" kr";$("art").replaceChildren(art(d))}
const card=$("card"),stage=$("stage");let idle=true,t=0;
function tilt(x,y){const r=stage.getBoundingClientRect(),px=Math.max(-1,Math.min(1,(x-r.left-r.width/2)/(r.width/2))),py=Math.max(-1,Math.min(1,(y-r.top-r.height/2)/(r.height/2)));card.style.transform=`rotateY(${px*14}deg) rotateX(${-py*10}deg)`}
addEventListener("mousemove",e=>{idle=false;tilt(e.clientX,e.clientY)});
addEventListener("touchmove",e=>{idle=false;tilt(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
addEventListener("deviceorientation",e=>{if(e.gamma==null)return;idle=false;card.style.transform=`rotateY(${Math.max(-14,Math.min(14,e.gamma/3))}deg) rotateX(${Math.max(-10,Math.min(10,((e.beta||45)-45)/4))}deg)`});
document.addEventListener("mouseleave",()=>idle=true);
setInterval(()=>{if(idle){t+=.05;card.style.transform=`rotateY(${Math.sin(t)*10}deg) rotateX(${Math.cos(t*.7)*4}deg)`}},40);
const showOv=(h,p)=>{$("mp").classList.remove("on");$("ovh").innerHTML=h;$("ovp").textContent=p;$("ov").classList.add("on")};
/* ---- payment ---- */
let pending=null;
function fallbackScreen(j){pending=j;$("mh").innerHTML=`Pay<br>${j.amount} kr`;$("mt").textContent=`Open MobilePay, enter exactly ${j.amount} kr and write "${j.reference.slice(-6).toUpperCase()}" as the message. Then tap "I have paid" and show this screen to the bartender.`;
 $("mgo").href=j.fallbackUrl;$("mgo").style.display="";$("mcp").style.display="";$("mdone").style.display="";$("mcx").style.display="";$("mp").classList.add("on")}
$("mcp").onclick=()=>{navigator.clipboard?.writeText(String(pending.amount));$("mcp").textContent="Copied ✓"};
$("mdone").onclick=()=>showOv("Show this<br>at the bar",`${desc()} — ${pending.amount} kr — code ${pending.reference.slice(-6).toUpperCase()}`);
window.mpDone=ok=>{$("mp").classList.remove("on")};
$("pay").onclick=async()=>{
 if(DEMO){showOv("Demo.<br>No payment.",`Would charge ${total()} kr for ${desc()}. Deploy the server to enable MobilePay.`);return}
 $("pay").disabled=true;$("pay").textContent="Opening…";
 try{const r=await fetch("/api/create-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:lines().map(([d,qty])=>({id:d.id,qty}))})});
  const j=await r.json();
  if(j.redirectUrl){location.assign(j.redirectUrl);return}   // opened as-is, as MobilePay requires
  if(j.fallbackUrl){fallbackScreen(j)}else throw 0;
 }catch{showOv("Oops.","Payment could not be started. Please ask the bartender.")}
 $("pay").disabled=false;$("pay").textContent="Pay with MobilePay →"};
const ref=new URLSearchParams(location.search).get("ref");
if(ref&&!DEMO){showOv("Checking<br>payment…","Hold on, asking MobilePay.");let n=0;
 const poll=async()=>{try{const j=await (await fetch("/api/status/"+ref)).json();
  if(j.status==="PAID")showOv("Paid.<br>Cheers.",`Show this at the bar: ${j.desc} (${j.total} kr). Code ${j.code}`);
  else if(j.status==="FAILED")showOv("Cancelled.","No money moved. Your liver thanks you.");
  else if(++n<45)setTimeout(poll,2000);else showOv("Still pending.","Ask the bartender before paying again.")}catch{if(++n<45)setTimeout(poll,3000)}};
 setTimeout(poll,2500)}
$("r0").classList.add("sel");show(0);</script></body></html>
